<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Response</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toastContainer"></div>

    <div class="app">

        <div class="topbar">
            <div class="brand"><span class="dot"></span> We are here for you </div>
            <a class="nav-link" href="login.html"> Admin →</a>
        </div>

        <div class="hero">
            <h1> Emergency Assistance</h1>
            <p>Press the button, we will send your location directly to the rescue team.</p>
        </div>

        <div class="card">

            <div class="field">
                <label for="emergencyType">Select the type of emergency</label>
                <select id="emergencyType">
                    <option value="Medical Emergency">🚑 Medical Emergency</option>
                    <option value="Police Emergency">🚓 Police Emergency</option>
                    <option value="Fire Emergency">🚒 Fire Emergency</option>
                    <option value="Accident">⚠️ Accident</option>
                </select>
            </div>

            <div class="field">
                <label for="emergencyDescription">Explain the problem (not necessary)</label>
                <textarea
                    id="emergencyDescription"
                    placeholder="e.g: Someone had and accident near at kijangwani bus stand..."
                    rows="4"
                ></textarea>
            </div>

        </div>

        <div class="sos-wrap">
            <button id="sosButton">
                <span class="icon">🚨</span>
                <span>EMERGENCY</span>
            </button>
        </div>
        <p class="sos-hint">Just click when youre in a real emergency situation</p>

        <div id="map"></div>

        <div id="emergencyInfo" class="emergency-info card">
            <h2>📋 Your Emergency Request</h2>

            <div class="info-row"><span>Type</span><span id="typeSummary">-</span></div>
            <div class="info-row"><span>Latitude</span><span id="latitude">-</span></div>
            <div class="info-row"><span>Longitude</span><span id="longitude">-</span></div>
            <div class="info-row"><span>Time</span><span id="emergencyTime">-</span></div>
            <div class="info-row"><span>Status</span><span id="status" class="badge badge-pending">Pending</span></div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
